name: Refresh binary GitHub profile

on:
  workflow_dispatch:
  schedule:
    - cron: '19 8 * * *'
  push:
    paths:
      - 'generate_profile.py'
      - 'assets/headshot.png'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Generate cards using uploaded photo and public GitHub statistics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_profile.py
      - name: Publish refreshed profile PNG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.png light_mode.png
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh binary portrait and stats"
            git push
          fi
